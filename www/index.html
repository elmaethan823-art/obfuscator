<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Repository File Browser</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 2rem;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      max-width: 900px;
      width: 100%;
      background: #161b22;
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    h1 span {
      background: #238636;
      font-size: 1rem;
      padding: 0.1rem 0.6rem;
      border-radius: 20px;
      color: #fff;
    }
    .subtitle {
      color: #8b949e;
      margin-bottom: 1.5rem;
    }
    .file-grid {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .file-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.6rem 1rem;
      background: #0d1117;
      border-radius: 8px;
      border: 1px solid #30363d;
      transition: background 0.2s;
    }
    .file-item:hover {
      background: #1c2128;
    }
    .file-item a {
      color: #58a6ff;
      text-decoration: none;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 0.9rem;
      word-break: break-all;
    }
    .file-item a:hover {
      text-decoration: underline;
    }
    .file-icon {
      font-size: 1.2rem;
      flex-shrink: 0;
    }
    .file-path {
      color: #8b949e;
      font-size: 0.8rem;
      margin-left: auto;
      flex-shrink: 0;
    }
    .footer {
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid #30363d;
      color: #8b949e;
      font-size: 0.9rem;
      text-align: center;
    }
    .footer a {
      color: #58a6ff;
      text-decoration: none;
    }
    .footer a:hover {
      text-decoration: underline;
    }
    @media (max-width: 640px) {
      body { padding: 1rem; }
      .container { padding: 1rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>
      📂 Repository Files
      <span>obfuscator</span>
    </h1>
    <p class="subtitle">
      All files from
      <a href="https://github.com/elmaethan823-art/obfuscator" style="color:#58a6ff;text-decoration:none;">
        elmaethan823-art/obfuscator
      </a>
    </p>

    <div class="file-grid">
      <!-- src/ folder -->
      <div class="file-item">
        <span class="file-icon">📁</span>
        <a href="https://github.com/elmaethan823-art/obfuscator/tree/main/src">src/</a>
        <span class="file-path">folder</span>
      </div>

      <!-- Files inside src/ -->
      <div class="file-item" style="margin-left: 1.5rem;">
        <span class="file-icon">📄</span>
        <a href="https://raw.githubusercontent.com/elmaethan823-art/obfuscator/main/src/httplib.h">httplib.h</a>
        <span class="file-path">C++ header</span>
      </div>
      <div class="file-item" style="margin-left: 1.5rem;">
        <span class="file-icon">📄</span>
        <a href="https://raw.githubusercontent.com/elmaethan823-art/obfuscator/main/src/main.cpp">main.cpp</a>
        <span class="file-path">C++ source</span>
      </div>

      <!-- www/ folder -->
      <div class="file-item">
        <span class="file-icon">📁</span>
        <a href="https://github.com/elmaethan823-art/obfuscator/tree/main/www">www/</a>
        <span class="file-path">folder</span>
      </div>

      <!-- Files inside www/ -->
      <div class="file-item" style="margin-left: 1.5rem;">
        <span class="file-icon">📄</span>
        <a href="https://raw.githubusercontent.com/elmaethan823-art/obfuscator/main/www/index.html">index.html</a>
        <span class="file-path">HTML</span>
      </div>

      <!-- Root files -->
      <div class="file-item">
        <span class="file-icon">📄</span>
        <a href="https://raw.githubusercontent.com/elmaethan823-art/obfuscator/main/README.md">README.md</a>
        <span class="file-path">Markdown</span>
      </div>
    </div>

    <div class="footer">
      <a href="https://github.com/elmaethan823-art/obfuscator">View on GitHub</a>
      &nbsp;·&nbsp;
      <a href="https://github.com/elmaethan823-art/obfuscator/archive/refs/heads/main.zip">Download ZIP</a>
    </div>
  </div>
</body>
</html>
